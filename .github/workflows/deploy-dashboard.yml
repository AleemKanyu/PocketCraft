name: Deploy Web Dashboard to Hostinger

on:
  push:
    branches:
      - main
      - external
      - feature/web-dashboard
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build App
        run: |
          cd dashboard
          npm run build

      - name: Resolve and Sanitize FTP Server
        id: ftp-config
        run: |
          RAW_SERVER="${{ secrets.HOSTINGER_FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|/.*$||' -e 's|:[0-9]*$||' | xargs)
          if [ -z "$CLEAN_SERVER" ]; then
            CLEAN_SERVER="46.202.161.214"
          fi
          echo "server=$CLEAN_SERVER" >> $GITHUB_OUTPUT

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: dashboard/dist/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false  # Set to true only if you want to wipe files not in the build folder
