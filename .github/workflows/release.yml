name: Update Manifest on Release

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate update.json
        run: |
          RELEASE=${{ github.event.release }}
          APK_URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/AleemKanyu/PocketCraft_/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          cat > update.json << EOF
          {
            "version": "${{ github.event.release.tag_name }}",
            "tag_name": "${{ github.event.release.tag_name }}",
            "release_name": "${{ github.event.release.name }}",
            "html_url": "${{ github.event.release.html_url }}",
            "download_url": "$APK_URL",
            "published_at": "${{ github.event.release.published_at }}"
          }
          EOF

      - name: Deploy to Hostinger
        run: |
          # Use your Hostinger FTP/SSH credentials
          # This example uses FTP - adjust for your setup
          ftp -n -v << EOF
          open ${{ secrets.HOSTINGER_FTP_HOST }}
          user ${{ secrets.HOSTINGER_FTP_USER }} ${{ secrets.HOSTINGER_FTP_PASS }}
          cd public_html/dist
          put update.json
          quit
          EOF
