name: Update Manifest on Release

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate update.json
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          APK_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          RELEASE_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.name')
          HTML_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.html_url')
          PUBLISHED_AT=$(printf '%s' "$RELEASE_JSON" | jq -r '.published_at')
          BODY=$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')
          jq -n \
            --arg version "$TAG_NAME" \
            --arg tag_name "$TAG_NAME" \
            --arg release_name "$RELEASE_NAME" \
            --arg html_url "$HTML_URL" \
            --arg download_url "$APK_URL" \
            --arg published_at "$PUBLISHED_AT" \
            --arg body "$BODY" \
            '{
              version: $version,
              tag_name: $tag_name,
              release_name: $release_name,
              html_url: $html_url,
              download_url: $download_url,
              published_at: $published_at,
              body: $body
            }' > update.json

      - name: Deploy to Hostinger
        run: |
          # Use your Hostinger FTP/SSH credentials
          # This example uses FTP - adjust for your setup
          ftp -n -v << EOF
          open ${{ secrets.HOSTINGER_FTP_HOST }}
          user ${{ secrets.HOSTINGER_FTP_USER }} ${{ secrets.HOSTINGER_FTP_PASS }}
          cd public_html/dist
          put update.json
          quit
          EOF
