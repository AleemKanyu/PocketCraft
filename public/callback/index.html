<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Linked - PocketHost</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 {
            color: #1DB954;
            margin: 0 0 10px;
            font-size: 24px;
        }
        p {
            color: #b3b3b3;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .command-box {
            background: #000000;
            border: 1px solid #1DB954;
            border-radius: 8px;
            padding: 14px 18px;
            font-family: monospace;
            font-size: 14px;
            color: #1DB954;
            word-break: break-all;
            margin-bottom: 16px;
            user-select: all;
        }
        .btn {
            background-color: #1DB954;
            color: #000000;
            border: none;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 24px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }
        .success-text {
            color: #1DB954;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎧</div>
        <h2>Spotify Authorized!</h2>
        <p>Copy the command below and paste it into Minecraft chat to finish linking your account:</p>
        
        <div class="command-box" id="cmd-box">Checking code...</div>
        <button class="btn" id="copy-btn" onclick="copyCommand()">📋 Copy Command</button>
        <div class="success-text" id="copied-msg">✔ Copied to clipboard! Now paste it in Minecraft.</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const box = document.getElementById('cmd-box');
        let fullCmd = '';

        if (code) {
            fullCmd = '/spotify auth ' + code;
            box.innerText = fullCmd;
        } else {
            box.innerText = 'No authorization code found in URL.';
            document.getElementById('copy-btn').style.display = 'none';
        }

        function copyCommand() {
            if (!fullCmd) return;
            navigator.clipboard.writeText(fullCmd).then(() => {
                document.getElementById('copied-msg').style.display = 'block';
            });
        }
    </script>
</body>
</html>
