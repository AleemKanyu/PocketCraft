# Pinned inputs for the PocketCraft OpenJDK 25 Android build.
#
# Every value here is pinned deliberately. Floating any of them breaks
# reproducibility, which is the whole point of this pipeline: anyone must be
# able to re-run it and get byte-identical output.

# --- OpenJDK source -------------------------------------------------------
# Upstream GA tag. Do not track a branch; a branch moves under you.
JDK_REPO="https://github.com/openjdk/jdk25u.git"
JDK_TAG="jdk-25.0.4.1-ga"
# Build number carried by that tag (jdk-25.0.4.1+1). Without it the version
# string comes out as "25.0.4.1-internal-..." which understates what this is.
JDK_VERSION_BUILD="1"

# --- Android NDK ----------------------------------------------------------
# r28 is the first NDK that emits 16 KB-aligned shared objects by default,
# which Android 15+ devices require and Google Play now enforces.
NDK_VERSION="r28"
NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

# Minimum supported Android API level for the produced runtime.
ANDROID_API="21"

# --- Boot JDK -------------------------------------------------------------
# Temurin, not Oracle: Temurin ships under GPLv2+CE, so nothing in this
# pipeline depends on accepting a proprietary download licence.
BOOT_JDK_VERSION="24.0.2+12"
BOOT_JDK_URL="https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2%2B12/OpenJDK24U-jdk_x64_linux_hotspot_24.0.2_12.tar.gz"
BOOT_JDK_DIR="jdk-24.0.2+12"

# --- Native dependencies --------------------------------------------------
FREETYPE_VERSION="2.10.0"
FREETYPE_URL="https://downloads.sourceforge.net/project/freetype/freetype2/${FREETYPE_VERSION}/freetype-${FREETYPE_VERSION}.tar.gz"
CUPS_VERSION="2.2.4"
CUPS_URL="https://github.com/apple/cups/releases/download/v${CUPS_VERSION}/cups-${CUPS_VERSION}-source.tar.gz"

# --- PocketCraft build identity ------------------------------------------
# These are what make the resulting binary identifiably OURS. They are fed to
# configure so they are compiled into libjvm.so and emitted into `release`.
# Never "fix" identity by editing the release file afterwards -- the strings
# baked into the binary are what anyone inspecting the APK will actually read.
VENDOR_NAME="PocketCraft"
VENDOR_URL="https://github.com/AleemKanyu/PocketCraft"
VENDOR_BUG_URL="https://github.com/AleemKanyu/PocketCraft/issues"
VENDOR_VM_BUG_URL="https://github.com/AleemKanyu/PocketCraft/issues"
VERSION_OPT="pocketcraft"

# --- Reproducibility ------------------------------------------------------
# How the build timestamp is fixed. "version" makes OpenJDK use its own
# DEFAULT_VERSION_DATE -- the release date of the tag we pin -- so the stamp
# baked into libjvm.so always agrees with the source it was built from and is
# identical on every rebuild.
#
# Do not replace this with a hardcoded epoch. A literal number has to be kept
# in sync with JDK_TAG by hand, and getting it wrong produces a runtime that
# claims to have been built before its own source existed -- which is exactly
# the kind of inconsistency that makes provenance look fabricated.
SOURCE_DATE_MODE="version"
