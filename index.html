<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="PocketHost" />
    <meta name="theme-color" content="#7FE620" />

    <!--
      Title, description, canonical, Open Graph, Twitter and JSON-LD tags are
      different on every page. scripts/prerender.mjs writes them here at build
      time from each page's <SEO> component, and src/seo/head.ts keeps them in
      step during client-side navigation.
    -->
    <!--app-head-->

    <!--
      Search Console and Bing Webmaster verification: verifying through a DNS TXT
      record needs no tag here. If you verify with an HTML tag instead, paste the
      <meta name="google-site-verification"> / <meta name="msvalidate.01"> line
      you are given directly below this comment.
    -->

    <!-- Favicons & Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-circle-hd.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/app-icon-circle-hd.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance: Preconnect to Font CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>

    <style>
      @font-face {
        font-family: 'Monocraft';
        src: url('/Monocraft.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <!-- Google Preferred Sources (Search, AI Overviews & Top Stories) -->
    <script async src="https://news.google.com/swg/js/v1/publisher.js"></script>
    <!--
      The Razorpay checkout script is deliberately not loaded here. Only the
      /world page takes payments, so WorldDrop's ensureRazorpayLoaded() injects
      it there instead of every page paying for a third-party script.
    -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
